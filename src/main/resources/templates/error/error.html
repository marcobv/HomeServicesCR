<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head(${titulo})}"></head>
<body>
<header th:replace="~{fragmentos :: header}"></header>
<main class="container my-5 py-5 text-center">
    <div class="card border-0 shadow-sm rounded-4 mx-auto" style="max-width: 680px;">
        <div class="card-body p-5">
            <div class="display-3 fw-bold text-primary-hs" th:text="${codigo}">500</div>
            <h1 class="h3 fw-bold mt-3" th:text="${titulo}">Error</h1>
            <p class="text-muted" th:text="${detalle}">No fue posible completar la solicitud.</p>
            <a class="btn btn-primary-hs" th:href="@{/inicio}">Volver al inicio</a>
        </div>
    </div>
</main>
<footer th:replace="~{fragmentos :: footer}"></footer>
</body>
</html>
