<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Recuperar contraseña')}"></head>
<body>
<header th:replace="~{fragmentos :: header}"></header>
<div th:replace="~{fragmentos :: mensajes}"></div>
<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h1 class="h3 fw-bold text-primary-hs">Recuperar contraseña</h1>
                    <p class="text-muted">Versión académica: confirme el correo registrado y defina una nueva contraseña.</p>
                    <form th:action="@{/usuarios/recuperar}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" name="correo" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nueva contraseña</label>
                            <input type="password" name="nuevaPassword" class="form-control" minlength="6" required/>
                        </div>
                        <button class="btn btn-primary-hs w-100" type="submit">Actualizar contraseña</button>
                    </form>
                    <div class="text-center mt-3"><a th:href="@{/usuarios/login}">Volver al inicio de sesión</a></div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragmentos :: footer}"></footer>
</body>
</html>
