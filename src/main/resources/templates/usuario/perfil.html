<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Mi perfil')}"></head>
<body>
<header th:replace="~{fragmentos :: header}"></header>
<div th:replace="~{fragmentos :: mensajes}"></div>
<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h1 class="h3 fw-bold text-primary-hs">Editar perfil</h1>
                    <p class="text-muted">Mantenga actualizados sus datos personales.</p>
                    <form th:action="@{/usuarios/perfil}" method="post" class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Nombre completo</label>
                            <input name="nombreCompleto" class="form-control" th:value="${usuario.nombreCompleto}" required maxlength="120"/>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Correo electrónico</label>
                            <input class="form-control" th:value="${usuario.correo}" disabled/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Teléfono</label>
                            <input name="telefono" class="form-control" th:value="${usuario.telefono}" maxlength="30"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Ubicación</label>
                            <input name="ubicacion" class="form-control" th:value="${usuario.ubicacion}" maxlength="120"/>
                        </div>
                        <div class="col-12 d-flex gap-2">
                            <button class="btn btn-primary-hs" type="submit">Guardar cambios</button>
                            <a class="btn btn-outline-secondary" th:href="@{/inicio}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragmentos :: footer}"></footer>
</body>
</html>
